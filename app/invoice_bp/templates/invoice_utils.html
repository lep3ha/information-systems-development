{% macro render_workpiece(item, values) %}
<article style="border: 1px solid; padding: 0.5rem; margin-bottom: 0.5rem">
    <h3>{{ item.id }}. {{ item.name }}</h3>
    <p>{{ item.type }}; {{ item.material }}; {{ item.weight }} кг</p>
    <label>Цена, руб.
        <input name="price_{{ item.id }}" type="number" min="0" step="0.01"
               value="{{ values.get('price_' ~ item.id, '') }}">
    </label>
    <label>Количество, шт.
        <input name="quantity_{{ item.id }}" type="number" min="1" step="1"
               value="{{ values.get('quantity_' ~ item.id, '1') }}">
    </label>
    <button type="submit" name="workpiece_id" value="{{ item.id }}">Добавить</button>
</article>
{% endmacro %}
