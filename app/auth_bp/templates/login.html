{% extends "base.html" %}
{% block title %}Авторизация — Супермаркет{% endblock %}
{% block content %}
<h1>Авторизация</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form action="{{ url_for('auth_bp.auth_index') }}" method="post">
    <p><label for="login">Логин</label>
    <input type="text" id="login" name="login" value="{{ login }}" autocomplete="username" required></p>
    <p><label for="password">Пароль</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required></p>
    <button type="submit">Войти</button>
</form>
{% endblock %}
