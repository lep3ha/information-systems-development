<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#111" stroke-width="2"/></marker></defs><g fill="none" stroke="#111" stroke-width="3"><circle cx="190" cy="43" r="15"/><path d="M190 58 V104 M158 76 H222 M190 104 L162 139 M190 104 L218 139"/></g><rect x="625" y="40" width="350" height="90" fill="white" stroke="#111" stroke-width="2"/><text x="190" y="172" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="middle" fill="#111">Пользователь</text><text x="800" y="76" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" fill="#111">Информационная</text><text x="800" y="110" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" fill="#111">система «Супермаркет»</text><path d="M190 190 V1162" stroke="#777" stroke-width="2" stroke-dasharray="9 8"/><path d="M800 190 V1162" stroke="#777" stroke-width="2" stroke-dasharray="9 8"/><text x="495" y="208" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Отправить код категории</text><text x="495" y="240" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">POST /query/products: category_id</text><path d="M190 260 H800" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="315" width="910" height="805" fill="none" stroke="#111" stroke-width="2"/><path d="M45 355 H105 L120 340 V315" fill="white" stroke="#111" stroke-width="2"/><text x="78" y="343" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" fill="#111">alt</text><rect x="125" y="343" width="800" height="34" fill="white"/><text x="140" y="370" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="start" fill="#111">[параметры корректны, строки найдены]</text><text x="495" y="420" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Таблица товаров (HTTP 200)</text><path d="M800 440 H190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9 6"/><path d="M45 495 H955" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/><rect x="125" y="523" width="800" height="34" fill="white"/><text x="140" y="550" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="start" fill="#111">[параметры корректны, строк нет]</text><text x="495" y="600" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">«Ничего не найдено» (HTTP 200)</text><path d="M800 620 H190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9 6"/><path d="M45 675 H955" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/><rect x="125" y="703" width="800" height="34" fill="white"/><text x="140" y="730" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="start" fill="#111">[некорректные параметры]</text><text x="495" y="778" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Форма с введёнными значениями</text><text x="495" y="810" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">и пояснением ошибки (HTTP 400)</text><path d="M800 830 H190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9 6"/><path d="M45 885 H955" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/><rect x="125" y="913" width="800" height="34" fill="white"/><text x="140" y="940" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="start" fill="#111">[ошибка подключения или выполнения SQL]</text><text x="495" y="966" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Форма с сохранением значений; сообщение</text><text x="495" y="998" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">«База данных недоступна. Попробуйте позже.»</text><text x="495" y="1030" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">(HTTP 503)</text><path d="M800 1050 H190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9 6"/></svg>