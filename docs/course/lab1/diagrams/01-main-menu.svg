<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="885" viewBox="0 0 1000 885"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#111" stroke-width="2"/></marker></defs><g fill="none" stroke="#111" stroke-width="3"><circle cx="190" cy="43" r="15"/><path d="M190 58 V104 M158 76 H222 M190 104 L162 139 M190 104 L218 139"/></g><rect x="625" y="40" width="350" height="90" fill="white" stroke="#111" stroke-width="2"/><text x="190" y="172" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="middle" fill="#111">Пользователь</text><text x="800" y="76" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" fill="#111">Информационная</text><text x="800" y="110" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" fill="#111">система «Супермаркет»</text><path d="M190 190 V857" stroke="#777" stroke-width="2" stroke-dasharray="9 8"/><path d="M800 190 V857" stroke="#777" stroke-width="2" stroke-dasharray="9 8"/><text x="495" y="198" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Открыть главное меню</text><text x="495" y="230" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">GET /</text><path d="M190 250 H800" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><text x="495" y="310" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Страница главного меню (HTTP 200)</text><path d="M800 330 H190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9 6"/><rect x="45" y="380" width="910" height="430" fill="none" stroke="#111" stroke-width="2"/><path d="M45 420 H105 L120 405 V380" fill="white" stroke="#111" stroke-width="2"/><text x="78" y="408" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" fill="#111">alt</text><rect x="125" y="408" width="800" height="34" fill="white"/><text x="140" y="435" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="start" fill="#111">[работа с запросами]</text><text x="495" y="458" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Выбрать «Работа с запросами»</text><text x="495" y="490" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">GET /query/</text><path d="M190 510 H800" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><text x="495" y="565" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Меню запросов (HTTP 200)</text><path d="M800 585 H190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9 6"/><path d="M45 625 H955" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/><rect x="125" y="643" width="800" height="34" fill="white"/><text x="140" y="670" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="start" fill="#111">[завершение работы]</text><text x="495" y="715" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Выбрать «Закончить работу»: GET /exit</text><path d="M190 735 H800" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><text x="495" y="770" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" fill="#111">Страница «До свидания» (HTTP 200)</text><path d="M800 790 H190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9 6"/></svg>