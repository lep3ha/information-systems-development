<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic</title>
</head>
<body>
<center>
    <h2>{{prod_title}}</h2>
    <p>
    <table border="1">
        <tr class = tab_title>
            <td>Название</td>
            <td>Единица измерения</td>
            <td>Стоимость</td>
        </tr>
    {% for product in products %}
        <tr>
            <td>{{product['prod_name']}}</td>
            <td>{{product['prod_measure']}}</td>
            <td>{{product['prod_price']}}</td>
        </tr>
    {% endfor %}
</table>
    </p>
</center>
</body>
</html>
