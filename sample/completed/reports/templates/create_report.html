<!DOCTYPE html>
<html>
<head>
    <title>Создание отчета</title>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: white;
            border: 1px solid #dee2e6;
            padding: 30px;
        }
        h1 {
            color: #212529;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 500;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            font-size: 14px;
            background-color: white;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #6c757d;
        }
        .flash {
            margin-bottom: 20px;
            padding: 15px;
            text-align: center;
        }
        .flash.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .flash.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 10px;
            background-color: #6c757d;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            margin-bottom: 15px;
        }
        .btn:hover {
            background-color: #5a6268;
        }
        .back-link {
            display: block;
            color: #6c757d;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
        }
        .back-link:hover {
            color: #495057;
            text-decoration: underline;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .button-group .back-link {
            flex: 1;
            padding: 8px;
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Создание отчета по продажам</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="month">Месяц:</label>
                <input type="number" id="month" name="month" min="1" max="12" required>
            </div>
            <div class="form-group">
                <label for="year">Год:</label>
                <input type="number" id="year" name="year" min="2020" max="2030" required>
            </div>
            <button type="submit" class="btn">Создать отчет</button>
        </form>

        <div class="button-group">
            <a href="{{ url_for('reports.reports_menu') }}" class="back-link">Назад в меню отчетов</a>
            <a href="{{ url_for('main_menu') }}" class="back-link">Главное меню</a>
        </div>
    </div>
</body>
</html>
